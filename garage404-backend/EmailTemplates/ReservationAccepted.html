<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmation de rendez-vous - Garage404</title>
</head>
<body>
  <div style="margin: 0; padding: 32px 16px; background-color: #f3f4f6; font-family: Arial, Helvetica, sans-serif; color: #1f2937; line-height: 1.5;">
    <div style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;">
      <div style="padding: 24px 32px; background-color: #171717; color: #ffffff;">
        <p style="margin: 0; font-size: 22px; font-weight: bold; letter-spacing: 0.5px;">Garage404</p>
        <p style="margin: 4px 0 0; color: #d1d5db; font-size: 14px;">Confirmation de rendez-vous</p>
      </div>

      <div style="padding: 32px;">
        <p style="margin: 0 0 16px; font-size: 16px;">Bonjour {{NAME}},</p>

        <p style="margin: 0 0 24px;">Votre rendez-vous est confirmé :</p>

        <div style="padding: 20px; background-color: #f9fafb; border-left: 4px solid #f59e0b; border-radius: 4px; font-size: 15px;">
          <p style="margin: 0 0 10px;"><span style="color: #6b7280;">Date</span><br><strong style="font-size: 17px;">{{DATE}}</strong></p>
          <p style="margin: 0 0 10px;"><span style="color: #6b7280;">Moto</span><br><strong>{{MOTO}}</strong></p>
          <p style="margin: 0 0 10px;"><span style="color: #6b7280;">Service</span><br><strong>{{SERVICE}}</strong></p>
          <p style="margin: 0;"><span style="color: #6b7280;">Durée estimée</span><br><strong>{{DURATION}} minutes</strong></p>
        </div>

        <p style="margin: 28px 0 0;">À bientôt,<br><strong>Garage404</strong></p>
      </div>

      <div style="padding: 16px 32px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 12px;">
        Ce message confirme votre rendez-vous chez Garage404.
      </div>
    </div>
  </div>
</body>
</html>
